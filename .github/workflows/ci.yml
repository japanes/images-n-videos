name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      VF_GOOGLE_MODE: stub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q -p no:cacheprovider

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      NUXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx eslint .
      - run: npx vitest run
      - run: npx nuxt generate

  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: render/package-lock.json
      - name: Lint
        working-directory: render
        run: |
          npm ci --no-audit --no-fund
          npm run lint
      - name: Build image
        run: docker build -t vf-ci/render render
      - name: Tests against the ffmpeg in the image
        run: |
          mkdir -p "$RUNNER_TEMP/render-data"
          docker run --rm -v "$RUNNER_TEMP/render-data:/data" vf-ci/render npm test

  stt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t vf-ci/stt stt
      - name: Lint and tests inside the image
        run: |
          docker run --rm -v "$PWD/stt:/src:ro" -w /src vf-ci/stt sh -c \
            "pip install -q -r requirements-dev.txt && ruff check --no-cache . && ruff format --check --no-cache . && pytest -q -p no:cacheprovider"

  compose-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compose file and scripts are valid
        run: |
          docker compose -f docker-compose.dev.yml config -q
          for f in scripts/*.sh; do
            bash -n "$f"
            test -x "$f" || { echo "$f is not executable"; exit 1; }
          done
