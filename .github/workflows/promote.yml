name: Promote

# Runs when a release is published (or by hand). Points the channel tags of
# the updater image at that release: "stable" when it is the newest published
# stable version, "beta" when it is the newest published version of any kind.
# New users start from these tags (release/compose.yml); installed apps update
# through the GitHub releases and do not need them.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to promote, for example 1.2.0 (empty = newest published)"
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Decide which tags move
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANTED: ${{ github.event.release.tag_name || inputs.version }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]' > releases.jsonl
          python3 - <<'PY'
          import json, os, re

          SEMVER = re.compile(r"^v?(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$")

          def key(version):
              m = SEMVER.match(version)
              major, minor, patch, pre = m.groups()
              if pre is None:
                  return (int(major), int(minor), int(patch), 1, ())
              parts = tuple((0, int(p), "") if p.isdigit() else (1, 0, p) for p in pre.split("."))
              return (int(major), int(minor), int(patch), 0, parts)

          published = []
          with open("releases.jsonl", encoding="utf-8") as fh:
              for line in fh:
                  rel = json.loads(line)
                  tag = rel.get("tag_name") or ""
                  if rel.get("draft") or not SEMVER.match(tag):
                      continue
                  if not any(a.get("name") == "manifest.json" for a in rel.get("assets") or []):
                      continue
                  published.append((tag.lstrip("v"), bool(rel.get("prerelease"))))
          if not published:
              raise SystemExit("no published releases with manifest.json")
          wanted = (os.environ.get("WANTED") or "").lstrip("v")
          if not wanted:
              wanted = max(published, key=lambda r: key(r[0]))[0]
          if wanted not in [v for v, _ in published]:
              raise SystemExit(f"{wanted} is not a published release with manifest.json")
          newest_any = max(published, key=lambda r: key(r[0]))[0]
          stables = [v for v, pre in published if not pre and "-" not in v]
          newest_stable = max(stables, key=key) if stables else None
          tags = []
          if wanted == newest_stable:
              tags.append("stable")
          if wanted == newest_any:
              tags.append("beta")
          print(f"version {wanted}; newest stable {newest_stable}; newest {newest_any}; "
                f"tags to move: {tags or 'none'}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={wanted}\n")
              out.write(f"tags={' '.join(tags)}\n")
          PY
      - name: Move the tags
        if: steps.plan.outputs.tags != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.plan.outputs.version }}
          TAGS: ${{ steps.plan.outputs.tags }}
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern manifest.json --dir manifest
          ref="$(python3 -c 'import json; print(json.load(open("manifest/manifest.json"))["images"]["updater"])')"
          case "$ref" in "$prefix/updater@sha256:"*) ;; *) echo "::error::unexpected updater image $ref"; exit 1 ;; esac
          for tag in $TAGS; do
            docker buildx imagetools create --tag "$prefix/updater:$tag" "$ref"
            echo "updater:$tag -> $ref" >> "$GITHUB_STEP_SUMMARY"
          done
