name: Release

# Push a tag like v1.2.0 (or v1.3.0-beta.1). This workflow runs the checks,
# builds the images for linux/amd64 + linux/arm64, pushes them to GHCR with
# the version tag and creates a DRAFT GitHub release with manifest.json and
# the zip for users. Nobody gets the update until the draft is published;
# publishing it also moves the stable/beta tag (promote.yml).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      prefix: ${{ steps.meta.outputs.prefix }}
    steps:
      - id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::Tag $tag is not v<major>.<minor>.<patch>[-pre]"
            exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"

  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: [meta, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: app
            context: .
            dockerfile: app/Dockerfile
          - service: render
            context: render
            dockerfile: render/Dockerfile
          - service: stt
            context: stt
            dockerfile: stt/Dockerfile
          - service: updater
            context: updater
            dockerfile: updater/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            VF_VERSION=${{ needs.meta.outputs.version }}
          tags: ${{ needs.meta.outputs.prefix }}/${{ matrix.service }}:${{ needs.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Save the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          case "$DIGEST" in sha256:*) ;; *) echo "::error::no digest"; exit 1 ;; esac
          mkdir -p digests
          printf '%s' "$DIGEST" > "digests/${{ matrix.service }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.service }}
          path: digests/${{ matrix.service }}
          retention-days: 7

  draft:
    needs: [meta, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
      PREFIX: ${{ needs.meta.outputs.prefix }}
      # Optional repository variable: oldest version that may update straight to this one.
      MIN_UPGRADE_FROM: ${{ vars.VF_MIN_UPGRADE_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: manifest.json
        run: |
          mkdir -p dist
          python3 - <<'PY'
          import json, os
          version = os.environ["VERSION"]
          prefix = os.environ["PREFIX"]
          images = {}
          for svc in ("app", "render", "stt", "updater"):
              with open(f"digests/{svc}", encoding="utf-8") as fh:
                  images[svc] = f"{prefix}/{svc}@{fh.read().strip()}"
          manifest = {
              "version": version,
              "prerelease": os.environ["PRERELEASE"] == "true",
              "images": images,
          }
          if os.environ.get("MIN_UPGRADE_FROM"):
              manifest["min_upgrade_from"] = os.environ["MIN_UPGRADE_FROM"]
          with open("dist/manifest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, indent=2)
              fh.write("\n")
          PY
          cat dist/manifest.json
      - name: Check manifest.json with the updater's own rules
        working-directory: updater
        run: |
          python3 -c '
          import json, os, sys
          from vf_updater import manifest
          data = json.load(open("../dist/manifest.json"))
          manifest.validate(data, os.environ["VERSION"], os.environ["PREFIX"])
          print("manifest ok")'
      - name: Zip for users
        run: |
          dir=dist/zip/vertexai-factory
          mkdir -p "$dir"
          cp release/compose.yml release/start.command release/stop.command \
             release/start.bat release/stop.bat release/README.txt "$dir/"
          {
            echo "# Vertex AI Factory settings."
            echo "# If port 8787 is busy, put another number here and start again."
            echo "VF_PORT=8787"
            if [ "$PRERELEASE" = "true" ]; then echo "VF_CHANNEL_TAG=beta"; fi
          } > "$dir/.env"
          sed -i 's/\r*$/\r/' "$dir/start.bat" "$dir/stop.bat" "$dir/README.txt"
          sed -i 's/\r$//' "$dir/start.command" "$dir/stop.command" "$dir/compose.yml" "$dir/.env"
          chmod 755 "$dir/start.command" "$dir/stop.command"
          chmod 644 "$dir/compose.yml" "$dir/start.bat" "$dir/stop.bat" "$dir/README.txt" "$dir/.env"
          (cd dist/zip && zip -X -r "../vertexai-factory-$VERSION.zip" vertexai-factory)
          unzip -l "dist/vertexai-factory-$VERSION.zip"
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$VERSION"
          assets=(dist/manifest.json "dist/vertexai-factory-$VERSION.zip")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            flags=(--draft --verify-tag --generate-notes --title "Vertex AI Factory $VERSION")
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
            gh release create "$tag" "${flags[@]}" "${assets[@]}"
          fi
          echo "Draft ready: check the notes and press Publish on GitHub." >> "$GITHUB_STEP_SUMMARY"
