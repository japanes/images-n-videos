# Development stack: every service is built from this repository.
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Opens on http://127.0.0.1:8787. Google calls are faked (VF_GOOGLE_MODE=stub)
# unless you start it with VF_GOOGLE_MODE=live.
name: vertexai-factory-dev

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
      args:
        VF_VERSION: 0.0.0-dev
    image: vf-dev/app:dev
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${VF_PORT:-8787}:8787"
    environment:
      VF_DATA_DIR: /data
      VF_VERSION: 0.0.0-dev
      VF_RENDER_URL: http://render:3000
      VF_STT_URL: http://stt:8000
      VF_GOOGLE_MODE: ${VF_GOOGLE_MODE:-stub}
      VF_ALLOWED_HOSTS: ${VF_ALLOWED_HOSTS:-}
    volumes:
      - data:/data
    logging: *logging

  render:
    build:
      context: render
    image: vf-dev/render:dev
    restart: unless-stopped
    environment:
      VF_DATA_DIR: /data
      VF_VERSION: 0.0.0-dev
    volumes:
      - data:/data
    logging: *logging

  stt:
    build:
      context: stt
    image: vf-dev/stt:dev
    restart: unless-stopped
    environment:
      VF_DATA_DIR: /data
      VF_VERSION: 0.0.0-dev
    volumes:
      - data:/data
    logging: *logging

volumes:
  data:
    name: vertexai-factory-dev-data
